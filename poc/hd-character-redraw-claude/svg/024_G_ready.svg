      <path d="M1.6 25.4 C5.2 26.5 12.6 26.6 17.4 25.2"/>
    </g>
    <!-- zip placket -->
    <path d="M9.4 18.6 C9.6 21.6 9.7 25 9.6 28.6" fill="none" stroke="#023a04" stroke-width="0.35" opacity="0.65"/>
    <path d="M9.9 18.8 C10.1 21.8 10.2 25 10.1 28.4" fill="none" stroke="#6af552" stroke-width="0.22" opacity="0.45"/>
    <path d="M2.6 27 C6 28.6 13.4 28.7 16.6 26.8 L16.5 27.4 C13.6 29.3 6 29.3 2.8 27.6 Z" fill="#034006" stroke="none"/>
    <path d="M2.3 20.4 C2.6 18.8 3.4 17.8 4.4 17.4" fill="none" stroke="#9cff7a" stroke-width="0.4" opacity="0.5"/>
