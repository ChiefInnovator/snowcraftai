    <path d="M10.6 26.6 C10.4 28.6 10.5 31.2 11.6 32.6 C13 33.6 15.6 33.5 16.8 32.4 C17.6 31.2 17.2 28.4 16.6 26.4 Z" fill="url(#legBack)" stroke="#0d1238"/>
    <path d="M11.6 32 C13 32.8 15.4 32.8 16.6 31.8" fill="none" stroke="#6461c8" stroke-width="0.3" opacity="0.6"/>
    <!-- near leg and boot -->
    <path d="M4.4 27.2 C4 29.6 4.2 33 5.2 34.8 C6.4 36 9.4 36 10.4 34.9 C11.2 33.6 10.9 30.2 10.5 27.4 Z" fill="url(#leg)" stroke="#0d1238"/>
    <path d="M5 34.2 C6.6 35.2 9.2 35.2 10.4 34.2" fill="none" stroke="#8e8af0" stroke-width="0.32" opacity="0.75"/>
    <ellipse cx="6.4" cy="33.3" rx="1.1" ry="0.6" fill="#a7a4ff" stroke="none" opacity="0.4"/>
    <!-- coat -->
