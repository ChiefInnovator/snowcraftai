    <path d="M14.6 16.8 C17.6 16.1 20.6 16.6 21.8 18.4 C22.5 19.6 21.9 21.4 20.4 21.8 C18.9 22.1 17.9 21.6 17.2 22.6 C16.6 23.6 16.4 24.6 15.4 24.4 C14.4 24.1 14.1 22.6 14.2 21 Z" fill="url(#sleeve)"/>
    <path d="M16.3 19.4 C16.4 21.4 16.2 23 15.6 24" fill="none" stroke="#9cff7a" stroke-width="0.3" opacity="0.5"/>
    <circle cx="21.1" cy="22.4" r="2.9" fill="url(#snow)" stroke="#5f6f92"/>
    <path d="M19.6 21 C20.3 20.4 21.4 20.3 22 20.7" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.9"/>
    <circle cx="22.3" cy="23.4" r="0.35" fill="#b9c7df" stroke="none"/>
    <circle cx="20.4" cy="23.9" r="0.3" fill="#b9c7df" stroke="none"/>
    <path d="M17.6 22.6 C17.2 24.2 18 25.8 19.6 26 C21.2 26.2 22.6 25.4 22.8 24.2 C21.6 25 20 24.8 19.2 23.8 C18.7 23.2 18.4 22.6 17.6 22.6 Z" fill="url(#mitten)" stroke="#7d6553"/>
    <!-- shadow where the hood meets the coat -->
    <ellipse cx="9.6" cy="17.6" rx="7.4" ry="1.4" fill="#022a03" stroke="none" opacity="0.5"/>
    <!-- hood -->
    <path d="M10.4 0.5 C5 0.4 1 3.8 0.8 9.4 C0.7 13.3 2.2 16.3 5.2 17.5 C9 18.7 14.5 18.3 17.6 16.5 C19.7 14.9 20.1 10 19.5 6.8 C18.5 2.6 15 0.5 10.4 0.5 Z" fill="url(#hood)"/>
    <ellipse cx="5.2" cy="5.2" rx="3.4" ry="2.3" transform="rotate(-35 5.2 5.2)" fill="#b4ff8c" stroke="none" opacity="0.16"/>
    <g fill="none" stroke="#023a04" stroke-width="0.22" opacity="0.28">
      <path d="M6.8 1.6 C3.6 4 2.4 9.4 3.4 14.6"/>
      <path d="M14.2 1.4 C11.8 2.6 9.6 4.2 8.2 6.4"/>
    </g>
    <!-- hood opening and face -->
    <path d="M6.2 9.6 C7.2 6.6 10.6 5.2 14.4 5.3 C17.4 5.4 19.6 6.8 19.7 9.4 C19.8 12.6 19 16 16 17.3 C12.8 18.4 8.2 18 6.2 16.2 C5 14.6 5.3 11.6 6.2 9.6 Z" fill="#034a06"/>
    <path d="M7 10.4 C7.9 7.8 10.8 6.6 14.1 6.7 C16.8 6.8 18.7 8 18.8 10.1 C18.9 12.9 18.2 15.4 15.6 16.4 C12.8 17.3 8.9 17 7.3 15.5 C6.4 14.2 6.4 12 7 10.4 Z" fill="url(#face)" stroke="#7f5d4e" stroke-width="0.25"/>
    <!-- knit rib along the hood edge -->
    <path d="M6.2 9.6 C7.2 6.6 10.6 5.2 14.4 5.3 C17.4 5.4 19.6 6.8 19.7 9.4" fill="none" stroke="#2fc523" stroke-width="0.3" stroke-dasharray="0.5 0.45" opacity="0.7"/>
    <!-- eyes, cheek, nose -->
    <ellipse cx="13.5" cy="11.3" rx="0.72" ry="0.98" fill="#2a1410" stroke="none"/>
    <circle cx="13.75" cy="10.9" r="0.28" fill="#ffffff" stroke="none"/>
    <ellipse cx="17.6" cy="9.9" rx="0.42" ry="0.8" fill="#2a1410" stroke="none"/>
    <circle cx="17.7" cy="9.6" r="0.16" fill="#ffffff" stroke="none"/>
    <ellipse cx="11.3" cy="13.4" rx="1.5" ry="0.9" fill="#f08a80" stroke="none" opacity="0.4"/>
    <path d="M16.4 12 C16.9 12.4 16.9 13.1 16.3 13.3" fill="none" stroke="#b07e6a" stroke-width="0.3"/>
    <ellipse cx="9.6" cy="10.3" rx="1.3" ry="0.8" transform="rotate(-20 9.6 10.3)" fill="#ffffff" stroke="none" opacity="0.5"/>
    <!-- knit pompom tuft -->
    <path d="M8.2 0.9 C8.6 -0.3 10.2 -0.4 10.8 0.3 C11.5 -0.4 13 -0.1 13.1 1 C13.2 1.8 12.1 2.1 10.7 2 C9.3 2.1 8 1.7 8.2 0.9 Z" fill="#078a07" stroke="#012a04" stroke-width="0.3"/>
    <path d="M9.2 0.8 L9.5 1.4 M10.8 0.6 L10.8 1.4 M12.1 0.8 L11.9 1.4" fill="none" stroke="#5ae83f" stroke-width="0.25"/>
  </g>
</svg>
