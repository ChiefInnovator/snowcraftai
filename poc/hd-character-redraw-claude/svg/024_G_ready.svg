<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 25 36" width="25" height="36">
  <!-- Green team, "G ready" (cast #24). Hand-drawn vector redraw in the
       original 25x36 frame coordinates; registration point (11,29) = feet.
       Three-quarter front view facing down-right, lit from the upper left. -->
  <defs>
    <radialGradient id="hood" cx="0.3" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#5ae83f"/>
      <stop offset="0.3" stop-color="#14b412"/>
      <stop offset="0.7" stop-color="#068107"/>
      <stop offset="1" stop-color="#034806"/>
    </radialGradient>
    <radialGradient id="coat" cx="0.22" cy="0.12" r="1">
      <stop offset="0" stop-color="#3fd22f"/>
      <stop offset="0.35" stop-color="#0aa20b"/>
      <stop offset="0.75" stop-color="#056b06"/>
      <stop offset="1" stop-color="#033e05"/>
    </radialGradient>
    <radialGradient id="sleeve" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#4fe03a"/>
      <stop offset="0.55" stop-color="#0c9e0c"/>
      <stop offset="1" stop-color="#055c06"/>
    </radialGradient>
    <radialGradient id="face" cx="0.38" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#fbeee0"/>
      <stop offset="0.5" stop-color="#ebc8a8"/>
      <stop offset="1" stop-color="#a98472"/>
    </radialGradient>
    <radialGradient id="snow" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e3ecf6"/>
      <stop offset="1" stop-color="#9eb0cf"/>
    </radialGradient>
    <radialGradient id="mitten" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.6" stop-color="#f1dfc2"/>
      <stop offset="1" stop-color="#bf9f82"/>
    </radialGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#1d2a66"/>
      <stop offset="0.55" stop-color="#2f2e86"/>
      <stop offset="1" stop-color="#5652c8"/>
    </linearGradient>
    <linearGradient id="legBack" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#141f52"/>
      <stop offset="1" stop-color="#34338c"/>
    </linearGradient>
  </defs>
  <g stroke="#012a04" stroke-width="0.35" stroke-linejoin="round" stroke-linecap="round">
