<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 34" width="26" height="34">
  <!-- Red team, "R ready" (cast #5). Hand-drawn vector redraw in the original
       26x34 frame coordinates; registration point (15,28) = feet. Seen from
       behind (three-quarter back view), lit from the upper left. -->
  <defs>
    <radialGradient id="hood" cx="0.3" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#f2402f"/>
      <stop offset="0.3" stop-color="#d0110d"/>
      <stop offset="0.7" stop-color="#930808"/>
      <stop offset="1" stop-color="#5c0405"/>
    </radialGradient>
    <radialGradient id="coat" cx="0.22" cy="0.12" r="1">
      <stop offset="0" stop-color="#e2241a"/>
      <stop offset="0.35" stop-color="#b80b0a"/>
      <stop offset="0.75" stop-color="#7d0606"/>
      <stop offset="1" stop-color="#4d0304"/>
    </radialGradient>
    <radialGradient id="sleeve" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#f03a2a"/>
      <stop offset="0.55" stop-color="#c70e0b"/>
      <stop offset="1" stop-color="#7a0606"/>
    </radialGradient>
    <radialGradient id="mitten" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.6" stop-color="#f3e3c6"/>
      <stop offset="1" stop-color="#c9ab8b"/>
    </radialGradient>
    <radialGradient id="face" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fbeee0"/>
      <stop offset="0.55" stop-color="#ecc9aa"/>
      <stop offset="1" stop-color="#b48a70"/>
    </radialGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4c4bb0"/>
      <stop offset="0.5" stop-color="#2f2e86"/>
      <stop offset="1" stop-color="#171c55"/>
    </linearGradient>
    <linearGradient id="bootBack" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#36358f"/>
      <stop offset="1" stop-color="#121848"/>
    </linearGradient>
  </defs>
  <g stroke="#360104" stroke-width="0.35" stroke-linejoin="round" stroke-linecap="round">
    <!-- far boot -->
    <path d="M13.4 27.2 C13.2 29.6 13.6 31.6 15.6 32.2 C17.6 32.8 19.9 32.1 20.3 30.4 C20.7 28.8 20.3 27.4 19.6 26.6 Z" fill="url(#bootBack)" stroke="#0d1238"/>
    <path d="M14.4 31.2 C16 31.9 18.3 31.8 19.6 30.9" fill="none" stroke="#5b5ab8" stroke-width="0.3" opacity="0.6"/>
    <!-- near boot -->
    <path d="M7.4 27.6 C6.6 30 7 32.9 9.3 33.5 C11.4 34 13.6 33.4 14 31.4 C14.3 29.8 13.8 28.3 13.2 27.4 Z" fill="url(#boot)" stroke="#0d1238"/>
    <path d="M8 32.3 C9.6 33.1 12 33 13.3 32" fill="none" stroke="#7472d0" stroke-width="0.3" opacity="0.7"/>
    <ellipse cx="9" cy="29.6" rx="1.1" ry="0.6" fill="#8a88e0" stroke="none" opacity="0.45"/>
    <!-- coat -->
    <path d="M7 13.8 C5.5 17.6 5.6 23.6 7.8 27 C10.4 28.7 17.8 28.9 20.6 27.3 C23.2 24.8 24 19 23.4 13.8 Z" fill="url(#coat)"/>
    <!-- quilted puffer seams and hem -->
    <g fill="none" stroke="#4a0304" stroke-width="0.32" opacity="0.55">
      <path d="M6.3 19.6 C10 20.8 18 20.9 23.6 19.4"/>
      <path d="M6.6 23.7 C10.3 24.9 18 25 22.9 23.6"/>
      <path d="M15.2 16.5 C15.5 20 15.4 24 15 28.1"/>
    </g>
    <path d="M7.7 26.4 C10.6 28 17.6 28.2 20.8 26.6 L20.6 27.3 C17.8 28.9 10.4 28.7 7.8 27 Z" fill="#5a0405" stroke="none"/>
    <path d="M7.3 18.2 C7.6 16.6 8.6 15.6 9.6 15.2" fill="none" stroke="#ff7a62" stroke-width="0.4" opacity="0.55"/>
    <!-- arm raised with mitten -->
    <path d="M9 14.6 C6.2 14 2.9 14.4 1.3 16.2 C0.3 17.6 0.8 20.2 2.6 20.8 C4.9 21.4 7.7 20.5 9.4 19.6 Z" fill="url(#sleeve)"/>
    <path d="M1.7 15.5 C2.9 14.8 4.6 14.6 5.6 15 L5.1 17.1 C4.1 16.8 2.7 17 1.6 17.6 C1.1 17 1.2 16.1 1.7 15.5 Z" fill="#8e0707" stroke-width="0.3"/>
    <path d="M2.6 19.4 C4.3 19.9 6.6 19.4 8.4 18.6" fill="none" stroke="#4a0304" stroke-width="0.3" opacity="0.5"/>
    <path d="M3.4 10.4 C1.6 10.4 0.8 12 1.1 13.6 C1.4 15.2 3.2 15.9 4.6 15.4 C6 14.9 6.3 12.9 5.6 11.6 C5.1 10.8 4.3 10.4 3.4 10.4 Z" fill="url(#mitten)" stroke="#7d6553"/>
    <path d="M5.4 12.2 C6.4 12.1 6.9 12.9 6.6 13.6 C6.3 14.2 5.6 14.2 5.3 13.8" fill="url(#mitten)" stroke="#7d6553" stroke-width="0.3"/>
    <ellipse cx="2.7" cy="11.9" rx="0.9" ry="0.55" fill="#ffffff" stroke="none" opacity="0.8"/>
    <!-- shadow where the hood meets the coat -->
    <ellipse cx="15.2" cy="15.6" rx="7.6" ry="1.5" fill="#3c0204" stroke="none" opacity="0.55"/>
    <!-- hood -->
    <path d="M15 0.7 C9.6 0.6 6 3.5 5.9 8.4 C5.8 11.9 7 14.4 9.5 15.4 C13 16.6 19.5 16.4 22.6 14.6 C25.1 13.1 25.6 9 25 6 C24 2.3 20.1 0.7 15 0.7 Z" fill="url(#hood)"/>
    <!-- knit seam from crown to nape -->
    <path d="M14.8 1.6 C12.6 5 12.2 10.6 13.2 15.6" fill="none" stroke="#5a0405" stroke-width="0.32" opacity="0.6"/>
    <path d="M14.1 1.8 C12 5.2 11.5 10.6 12.4 15.4" fill="none" stroke="#ff6a52" stroke-width="0.22" opacity="0.4"/>
    <!-- hood rim around the face, seen from behind -->
    <path d="M19.4 7 C19.9 5.9 21.4 5.7 22.5 6.3 C23.5 7 23.7 8.8 23.3 10.1 C22.9 11.3 21.6 11.8 20.6 11.3 C19.5 10.7 19 8.4 19.4 7 Z" fill="#640506" stroke="#360104" stroke-width="0.3"/>
    <path d="M20.7 7.1 C21.4 6.7 22.4 7 22.7 7.8 C23 8.8 22.8 10.1 22 10.5 C21.3 10.8 20.7 10.3 20.5 9.4 C20.3 8.6 20.3 7.6 20.7 7.1 Z" fill="url(#face)" stroke="#8b6450" stroke-width="0.22"/>
    <ellipse cx="21.4" cy="7.9" rx="0.5" ry="0.38" fill="#ffffff" stroke="none" opacity="0.8"/>
    <!-- glossy highlight on the hood -->
    <ellipse cx="10.2" cy="4.8" rx="3.4" ry="2.2" transform="rotate(-28 10.2 4.8)" fill="#ff8a70" stroke="none" opacity="0.18"/>
    <!-- knit ribs following the hood -->
    <g fill="none" stroke="#4a0304" stroke-width="0.22" opacity="0.28">
      <path d="M11.4 1.6 C8.4 4 7.6 9.6 9.4 14.6"/>
      <path d="M17.6 1.4 C16.6 5 16.8 10.6 17.8 15.4"/>
      <path d="M20.6 2.2 C21.8 3.6 22.4 4.6 22.9 5.6"/>
    </g>
    <!-- knit pompom tuft -->
    <path d="M12.6 1.1 C13 -0.2 14.6 -0.4 15.2 0.3 C15.9 -0.4 17.5 -0.1 17.6 1 C17.7 1.8 16.6 2.2 15.2 2.1 C13.8 2.2 12.4 1.9 12.6 1.1 Z" fill="#9c0808" stroke="#360104" stroke-width="0.3"/>
    <path d="M13.6 0.9 L13.9 1.5 M15.2 0.6 L15.2 1.4 M16.6 0.8 L16.4 1.5" fill="none" stroke="#e0322a" stroke-width="0.25"/>
  </g>
</svg>
